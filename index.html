<style>
:root{--bg:#f5efe3;--fg:#3a3127;--mu:#74675a;--ln:#e4d9c4;--ac:#8a5a2f;--ac2:#efe4d1;--onac:#fff;--ok:#3f6e3d;--okb:#e8efdc;--no:#a1402f;--nob:#f6e3dc;--cd:#fbf7ee;--sh:0 1px 2px rgba(90,70,40,.06),0 8px 24px rgba(90,70,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#1f1a14;--fg:#efe6d6;--mu:#b8a98f;--ln:#3a3226;--ac:#d9a56c;--ac2:#2f271c;--onac:#2a1d0e;--ok:#9fcf8f;--okb:#25301f;--no:#e9907f;--nob:#3a2420;--cd:#2a231a;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 340px at 50% -80px,var(--ac2),transparent) var(--bg) no-repeat;min-height:100vh}
main{max-width:680px;margin:0 auto;padding:36px 16px 72px}
h1{font-size:2rem;font-weight:750;letter-spacing:-.03em;margin:0 0 4px}h2{font-size:1.3rem;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.mu{color:var(--mu);font-size:.92rem}.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chip{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:4px 12px;font-size:.85rem;font-weight:600}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:26px;margin:18px 0;box-shadow:var(--sh)}
button,input{font:inherit;color:inherit}
button{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:500;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px);box-shadow:0 4px 12px rgba(138,90,47,.15)}button:active:not(:disabled){transform:none}
button:disabled{opacity:.5;cursor:default}button.p{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:600}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
textarea,input[type=text]{width:100%;padding:13px 14px;border:2px solid var(--ln);border-radius:12px;background:var(--bg);font-size:1.05rem}textarea:focus,input[type=text]:focus{border-color:var(--ac);outline:0}
select{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}textarea{min-height:150px;resize:vertical;font:inherit;color:inherit}input[type=checkbox],input[type=range]{accent-color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;align-items:center}
.opts{display:grid;gap:10px;margin:16px 0;counter-reset:o}.opts button{text-align:left;display:flex;gap:12px;align-items:center;padding:13px 14px;border-width:2px}
.opts button:before{counter-increment:o;content:counter(o,upper-alpha);flex:none;width:26px;height:26px;border-radius:8px;background:var(--ac2);color:var(--ac);font-size:.8rem;font-weight:700;display:grid;place-items:center}
.opts button.ok,.opts button.no{opacity:1}
.ok{border-color:var(--ok)!important;background:var(--okb)!important}.no{border-color:var(--no)!important;background:var(--nob)!important}
.bar{height:8px;background:var(--ln);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .28s}
table{border-collapse:separate;border-spacing:5px;width:100%;font-size:.85rem}td,th{text-align:center;padding:0}th{font-weight:600;color:var(--mu);font-size:.78rem}tr>th:first-child{color:var(--fg);font-size:.9rem;text-align:left;padding-right:6px}
td button{width:100%;padding:11px 0;border-radius:10px;font-weight:650;font-size:.88rem;border-color:transparent;background:color-mix(in srgb,var(--ac) calc(var(--p,0)*.42%),var(--ac2));color:var(--fg)}
td button[disabled]{background:transparent;border:1px dashed var(--ln)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--ac2)}.fb:empty{display:none}.miss{color:var(--no);font-weight:650;text-decoration:underline}
.flip>div{min-height:160px;border:2px solid var(--ln);border-radius:16px;padding:28px;text-align:center;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;justify-content:center;transition:border-color .2s}.flip>div:hover{border-color:var(--ac)}
ul{padding-left:20px}summary{cursor:pointer;font-weight:650;padding:8px 0}details+details{border-top:1px solid var(--ln)}details li{margin:4px 0}.msg{padding:10px 14px;border-radius:12px;margin:8px 0;white-space:pre-wrap}.msg.u{background:var(--ac2);margin-left:15%}.msg.a{background:var(--bg);border:1px solid var(--ln);margin-right:15%}
@media(max-width:480px){main{padding-top:24px}.card{padding:18px}h1{font-size:1.6rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Polish layer: softer, richer beige theme (CSS only) ===== */
body{background:radial-gradient(900px 420px at 15% -120px,color-mix(in srgb,var(--ac) 14%,transparent),transparent),radial-gradient(700px 380px at 100% 100%,color-mix(in srgb,var(--ac) 9%,transparent),transparent),var(--bg);background-attachment:fixed;letter-spacing:.005em}
h1,h2{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;letter-spacing:-.015em}
h1{font-size:2.35rem;font-weight:700;line-height:1.1}
#app>*{animation:up .24s ease both}@keyframes up{from{opacity:0;transform:translateY(6px)}}
#app>.hd:first-child{padding:28px 26px;border-radius:26px;border:1px solid var(--ln);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 16%,var(--cd)),var(--cd) 70%);box-shadow:var(--sh);margin-bottom:18px;align-items:center}
#app>.hd:first-child .mu{margin:6px 0 0;max-width:34ch}
.card{border-radius:24px;padding:28px;background:linear-gradient(180deg,var(--cd),color-mix(in srgb,var(--cd) 94%,var(--ac2)));box-shadow:var(--sh)}
.card>h2:first-child::before,.card>.hd:first-child h2::before{content:"";display:inline-block;width:6px;height:1.05em;margin-right:12px;background:linear-gradient(var(--ac),color-mix(in srgb,var(--ac) 55%,#e3b27c));border-radius:4px;vertical-align:-.14em}
button{border-radius:14px;padding:11px 18px;box-shadow:0 1px 2px rgba(90,70,40,.06)}
button.p{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 86%,#fff),var(--ac));box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
button.p:hover:not(:disabled){box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 40%,transparent)}
.chip{background:color-mix(in srgb,var(--ac) 14%,var(--cd));border:1px solid color-mix(in srgb,var(--ac) 22%,transparent)}
.seg{background:var(--ac2);padding:5px;border-radius:18px;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;box-shadow:none;border-radius:13px;color:var(--mu)}
.seg button:hover:not(:disabled){transform:none;box-shadow:none;color:var(--fg)}
.seg button.p{background:var(--cd);color:var(--ac);font-weight:650;box-shadow:0 2px 10px rgba(90,70,40,.14)}
table{border-spacing:6px}tr>th:first-child{font-family:Georgia,serif;font-size:1rem}
td button{padding:13px 0;border-radius:14px;font-size:.92rem;border:1px solid color-mix(in srgb,var(--ac) 14%,transparent)}
td button:hover:not(:disabled){transform:translateY(-2px)}
.opts{gap:12px}.opts button{padding:15px 16px;border-radius:16px;font-size:1.02rem;background:var(--cd)}
.opts button:before{width:30px;height:30px;border-radius:50%;font-size:.82rem}
.bar{height:10px;background:color-mix(in srgb,var(--ln) 80%,transparent)}.bar i{background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#e3b27c))}
.fb{border-radius:16px;border-left:4px solid var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--cd))}
details{padding:4px 0}details+details{border-top:1px solid var(--ln)}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;border-radius:12px}
summary::-webkit-details-marker{display:none}summary::after{content:"+";flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ac2);color:var(--ac);font-weight:700}
details[open]>summary::after{content:"–"}summary:hover{background:color-mix(in srgb,var(--ac) 7%,transparent)}
details[open]{animation:up .2s ease both}
select{border-radius:14px;padding:11px 14px;box-shadow:0 1px 2px rgba(90,70,40,.06)}
textarea,input[type=text]{border-radius:16px;background:var(--cd)}
.flip>div{border-radius:22px;min-height:190px;background:linear-gradient(160deg,var(--cd),var(--ac2));font-size:1.15rem}
.msg.u{background:color-mix(in srgb,var(--ac) 16%,var(--cd))}.msg{border-radius:18px}
@media(max-width:480px){h1{font-size:1.9rem}#app>.hd:first-child{padding:22px 18px}.card{padding:20px;border-radius:20px}}
@media(prefers-reduced-motion:reduce){#app>*,details[open]{animation:none}}
/* ===== Modern layer: gradients, glass, motion ===== */
:root{--ac:#b4632c;--ac2:#f3e6d0;--g1:#c9743a;--g2:#e0a24f;--glow:rgba(201,116,58,.28)}
@media(prefers-color-scheme:dark){:root{--ac:#e8a86a;--g1:#e8a86a;--g2:#f2c98a;--glow:rgba(232,168,106,.22)}}
body{background:radial-gradient(900px 480px at 10% -140px,color-mix(in srgb,var(--g1) 22%,transparent),transparent),radial-gradient(760px 420px at 100% 105%,color-mix(in srgb,var(--g2) 16%,transparent),transparent),var(--bg);background-attachment:fixed}
h1{background:linear-gradient(120deg,var(--fg) 30%,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
#app>.hd:first-child{position:relative;overflow:hidden;backdrop-filter:blur(10px);border-radius:28px}
#app>.hd:first-child::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.card{position:relative;border:1px solid color-mix(in srgb,var(--ac) 14%,var(--ln));backdrop-filter:blur(8px);transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 14px 36px color-mix(in srgb,var(--ac) 14%,transparent),var(--sh)}
button{border-radius:14px;letter-spacing:.01em}
button.p{background:linear-gradient(135deg,var(--g1),var(--g2));border:0;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 8px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
button.p:hover:not(:disabled){transform:translateY(-2px);filter:saturate(1.1) brightness(1.04)}
button:active:not(:disabled){transform:scale(.97)}
.chip{background:linear-gradient(135deg,color-mix(in srgb,var(--g1) 18%,var(--cd)),color-mix(in srgb,var(--g2) 22%,var(--cd)));box-shadow:0 2px 10px var(--glow)}
.opts button{position:relative;overflow:hidden;transition:transform .15s,border-color .2s,box-shadow .2s,background .2s}
.opts button:hover:not(:disabled){transform:translateX(4px);box-shadow:0 6px 18px var(--glow)}
.opts button:before{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 3px 8px var(--glow)}
.opts button.ok{animation:pop .4s ease}.opts button.no{animation:shk .4s ease}
@keyframes pop{40%{transform:scale(1.03)}}@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bar{height:12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.bar i{background:linear-gradient(90deg,var(--g1),var(--g2),var(--g1));background-size:200% 100%;animation:sh 2.4s linear infinite;box-shadow:0 0 12px var(--glow)}
@keyframes sh{to{background-position:-200% 0}}
.fb{box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 10%,transparent);animation:up .25s ease both}
.seg{box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.seg button.p{background:var(--cd);color:var(--ac);text-shadow:none;box-shadow:0 3px 12px var(--glow)}
summary{transition:background .2s}summary::after{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
::selection{background:color-mix(in srgb,var(--g1) 35%,transparent)}
@media(prefers-reduced-motion:reduce){.bar i,.opts button.ok,.opts button.no{animation:none}}
/* ===== Extra flair layer ===== */
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;animation:fl 18s ease-in-out infinite alternate}
body::before{width:340px;height:340px;left:-90px;top:20%;background:color-mix(in srgb,var(--g1) 32%,transparent)}
body::after{width:300px;height:300px;right:-80px;bottom:8%;background:color-mix(in srgb,var(--g2) 30%,transparent);animation-delay:-9s}
@keyframes fl{to{transform:translate(40px,-50px) scale(1.15)}}
main{position:relative}
#app>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3){animation-delay:.08s}#app>*:nth-child(4){animation-delay:.12s}#app>*:nth-child(n+5){animation-delay:.16s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,color-mix(in srgb,var(--g1) 45%,transparent),transparent 40%,transparent 60%,color-mix(in srgb,var(--g2) 40%,transparent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
button.p{position:relative;overflow:hidden}
button.p::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .6s}
button.p:hover:not(:disabled)::after{left:130%}
button:not(.p):hover:not(:disabled){background:color-mix(in srgb,var(--g1) 9%,var(--cd))}
textarea:focus,input[type=text]:focus,select:focus{border-color:var(--g1);box-shadow:0 0 0 4px var(--glow)}
.chip{animation:pl 3s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 2px 16px var(--glow),0 0 0 4px color-mix(in srgb,var(--g1) 10%,transparent)}}
.flip>div{box-shadow:0 14px 34px var(--glow);transition:transform .25s,box-shadow .25s,border-color .2s}
.flip>div:hover{transform:translateY(-3px) rotate(-.3deg)}
td button:hover:not(:disabled){box-shadow:0 8px 18px var(--glow)}
.msg{box-shadow:0 2px 10px rgba(90,70,40,.06);animation:up .25s ease both}
.msg.u{background:linear-gradient(135deg,color-mix(in srgb,var(--g1) 22%,var(--cd)),color-mix(in srgb,var(--g2) 20%,var(--cd)))}
h2{background:linear-gradient(120deg,var(--fg) 55%,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.card>h2:first-child::before,.card>.hd:first-child h2::before{background:linear-gradient(var(--g1),var(--g2));box-shadow:0 0 10px var(--glow);border-radius:4px}
.miss{text-decoration-color:var(--g1);text-underline-offset:3px}
html{scroll-behavior:smooth}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--g1) 40%,var(--ln));border-radius:99px;border:2px solid var(--bg)}
@media(prefers-reduced-motion:reduce){body::before,body::after,.chip{animation:none}html{scroll-behavior:auto}}
/* ===== Colour themes (switch with the floating palette button) ===== */
html[data-theme=ocean]{--ac:#2563a8;--ac2:#e0edfa;--bg:#eef4fb;--cd:#fafcff;--ln:#d3e1f1;--fg:#1b2a3b;--mu:#5a6f87;--g1:#3b82d6;--g2:#3cc4d9;--glow:rgba(59,130,214,.28)}

html[data-theme=ocean]{--ac:#7fb4f0;--ac2:#1b2a3d;--bg:#101821;--cd:#16212d;--ln:#243447;--fg:#e4eef9;--mu:#98adc4;--g1:#6aa8ee;--g2:#5fd6e6;--glow:rgba(106,168,238,.22)}
html[data-theme=forest]{--ac:#8fd0a5;--ac2:#1d2e23;--bg:#111a14;--cd:#17231b;--ln:#27382c;--fg:#e4f1e7;--mu:#9ab5a1;--g1:#6fc08d;--g2:#c4e07a;--glow:rgba(111,192,141,.22)}
html[data-theme=violet]{--ac:#b99af0;--ac2:#271d3b;--bg:#15101f;--cd:#1c1629;--ln:#31264a;--fg:#ece4fb;--mu:#a99bc4;--g1:#a07cf0;--g2:#e68ff0;--glow:rgba(160,124,240,.22)}
html[data-theme=rose]{--ac:#f08aa6;--ac2:#3a1e29;--bg:#1d1015;--cd:#26161d;--ln:#432531;--fg:#fbe6ec;--mu:#c79aa8;--g1:#f0708f;--g2:#f7b36e;--glow:rgba(240,112,143,.22)}}
#thm{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;width:48px;height:48px;padding:0;border-radius:50%;border:0;font-size:1.3rem;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 22px var(--glow);color:#fff}

/* ===== Final polish ===== */
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

h1,h2{text-wrap:balance}p{text-wrap:pretty}
.mu{line-height:1.5}
:focus-visible{outline:3px solid var(--g1);outline-offset:3px;border-radius:12px;box-shadow:0 0 0 6px var(--glow)}
button:disabled{cursor:not-allowed}
.opts button:disabled:not(.ok):not(.no){opacity:.55}
.opts button{min-height:52px;line-height:1.35}

.fb:not(:empty){animation:up .25s ease both}

@media(max-width:480px){main{padding-top:20px}.opts button{padding:14px}.row>button{flex:1 1 auto}.msg.u{margin-left:8%}.msg.a{margin-right:8%}#thm{width:44px;height:44px;right:12px}}

/* ===== Finishing touches: icons, table headers, readability ===== */
h2{background:linear-gradient(120deg,var(--fg) 82%,color-mix(in srgb,var(--g1) 65%,var(--fg)))}
table th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding-bottom:4px}
table th:nth-child(n+2)::before{display:block;font-size:1.3rem;margin-bottom:2px;letter-spacing:0;text-transform:none}
table th:nth-child(2)::before{content:"👂"}table th:nth-child(3)::before{content:"🗣️"}table th:nth-child(4)::before{content:"📖"}
table th:nth-child(5)::before{content:"✍️"}table th:nth-child(6)::before{content:"🔤"}table th:nth-child(7)::before{content:"🔊"}
tr>th:first-child{font-size:1.05rem}
td button{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--g1) calc(var(--p,0)*.5%),transparent)}

["Tenses","Present simple: habits and facts. Present continuous: now or temporary.|Past simple: finished time. Present perfect: connects past and now (since, for, already).|Past perfect: the earlier of two past events. Future perfect: finished by a future time.|Time words guide you: yesterday, since 2019, by next year.","s:tenses"],
["Present simple","Form: I/you/we/they + base verb; he/she/it + verb-s. Negative: don't/doesn't + base verb. Question: Do/Does + subject + base verb.|Use: habits, routines, facts and timetables.|Signals: always, usually, often, every day, on Mondays.|Example: She works in a bank. The train leaves at 8.","s:presentSimple"],

["Present perfect","Form: have/has + past participle.|Use: past actions with a result now, life experience, and unfinished time up to now.|Signals: already, yet, just, ever, never, since, for, so far.|Example: I have lost my keys. She has lived here since 2019.","s:perfect"],

["Past simple","Form: verb-ed or an irregular form (go-went). Negative: didn't + base verb. Question: Did + subject + base verb.|Use: finished actions at a finished time, and series of past events.|Signals: yesterday, last week, ago, in 2010, when.|Example: We visited Hue last summer. He opened the door and walked in.","s:pastSimple"],

["Going to and present for the future","Form: am/is/are going to + base verb. The present continuous and present simple can also show the future.|Use: going to = plans and predictions from evidence. Present continuous = arranged plans. Present simple = timetables.|Signals: Look at the clouds!, this weekend, the train leaves at nine.|Example: It's going to rain. I'm seeing the dentist on Friday.","s:futures"],

const LSN={
7:`Use the present simple for habits and the present continuous for actions now.|I collect stamps on Sundays, and I am sorting my stamps now.
Use a or an for one of many things, the for something known, and no article for general ideas.|I eat an apple and the snack in my bag; fruit keeps me healthy.
Learn fixed pairs: volunteer at, donate to, clean up, take part in.|We took part in a clean-up and donated clothes to a charity.
Change the word class: perform, performer, performance; talent, talented.|The talented performer gave a great performance at the exhibition.
Use some or any with uncountable food, and a or an before singular countable nouns.|I need an onion and some oil, but there isn't any salt.
Use the past simple to tell the story of a visit.|We visited the laboratory and had lunch in the canteen.
Use prepositions of movement: across, along, through, at the junction.|Walk along the pavement and cross at the junction.
Link ideas with and, but, so, because and although.|I liked the plot because it was exciting, but the ending was sad.
Common phrasal verbs for events: set off, take part in, dress up, look forward to.|People dress up and take part in the parade.
Make adjectives and nouns: renewable, electricity, electric, electrical.|Solar power is renewable, so it protects the environment.
Use will and might for predictions. First conditional: if + present simple, will + verb.|If cars become driverless, journeys will be safer.
Use the with some places (the UK, the USA) but not with most countries.|London is the capital of the UK, and Canada is a large country.`,
8:`After like, love, enjoy and be keen on, use verb-ing.|She is keen on cycling and enjoys exploring new roads.
Use prepositions with places: in the village, on a farm, near the river, from the city.|Farmers live on farms near the river and work in the fields.
Form words: confident, confidence; independent, independence.|Teenagers need independence, but they also feel pressure.
Use the with groups and unique things (the highlands). Plural general nouns take no article.|Many families live in stilt houses in the mountains.
Useful phrasal verbs: bring up, hand down, die out, look up to.|Customs are handed down, so we look up to our ancestors.
Use however, therefore and besides to link sentences.|He sleeps late; however, he keeps a healthy routine.
First conditional for real results: if + present simple, will + verb.|If we recycle more, we will reduce pollution.
Prepositions of price and place: on sale, at a discount, for five dollars, in the shop.|The shoes were on sale at a discount, so I bought them for half price.
Use the past continuous for background and the past simple for sudden events.|We were sleeping when the earthquake struck.
Second conditional for unreal ideas: if + past simple, would + verb.|If we had holograms, we would talk face to face from anywhere.
Form nouns from verbs: invent, invention; discover, discovery; develop, development.|The invention of the phone was a breakthrough in communication.
Reported speech moves the tense back: is becomes was.|"There is water on Mars," she said. = She said that there was water on Mars.`,
9:`Phrasal verbs for community life: set up, carry on, pass down, hand down.|Artisans pass down their skills and carry on the craft.
Use prepositions of place and movement: in the city centre, on the metro, through the park, across the bridge.|I take the metro across the river every morning.
The present perfect links the past and now: have + past participle.|I have joined a club, so I have felt less stressed since then.
Use used to + verb for past habits that have stopped.|We used to play outside until dark, but now we play online.
Use the present perfect for experiences with ever, never, already and yet.|Have you ever tried a new sport? I have never been camping.
Rewrite with used to, comparatives and the passive.|People used to travel by bike. = Bikes were once the usual transport.
Use the with unique natural features (the Amazon, the Pacific), but not with most single mountains.|We visited the Grand Canyon and climbed Mount Fuji.
Use a or an for singular countable nouns, and no article for general plurals.|Tourists need a map and an itinerary, and they enjoy sightseeing.
Use although, despite and whereas to show contrast.|Although accents differ, people still understand each other.
Second conditional for unreal present situations: if + past simple, would + verb.|If we stopped burning coal, the climate would improve.
Make words with -able, -less and -er: wireless, rechargeable, user.|A wireless charger is useful, but a rechargeable battery is better.
Rewrite using the passive and gerunds.|They will train the apprentices. = The apprentices will be trained.`,
10:`Use the present simple for routines and the present continuous for temporary changes.|My mother cooks dinner, but this week my father is cooking.
First conditional for real results: if + present simple, will + verb.|If we save energy, we will cut emissions.
Make nouns for people and things: compose, composer; perform, performance.|The composer wrote a melody that suits the lyrics.
Useful phrasal verbs: set up, give out, clean up, take on.|Students set up a club and gave out leaflets.
Use the past simple passive for inventions and the present perfect passive for change up to now.|The telephone was invented in 1876 and has been improved ever since.
Use whereas, while and in contrast to compare groups.|Some jobs once needed men, whereas today they are open to everyone.
Use prepositions with organisations: member of, cooperation with, belong to.|Viet Nam is a member of the UN and cooperates with many countries.
Form adjectives and adverbs: interactive, effective, effectively.|Interactive lessons help students learn effectively.
Second conditional: if + past simple, would + verb. Unless means if not.|If more people used buses, there would be less pollution.
Use the with places already mentioned and zero article for general ideas.|Ecotourism protects nature, so the local area benefits.`,
11:`Use the past simple for finished time and the present perfect for experience up to now.|I have exercised since 2020, and I started jogging last year.
Use but, however, even though and whereas to show differences between generations.|Teenagers like fast change, whereas grandparents prefer routine.
Use first and second conditionals for predictions and ideas.|If cities used more green energy, they would be cleaner.
Use prepositions with regional ideas: member of, relations with, cooperation among, benefit from.|Viet Nam benefits from cooperation among ASEAN members.
Third conditional for past regrets: if + had + past participle, would have + past participle.|If we had cut emissions earlier, temperatures would have risen less.
Rewrite using the passive and have something done.|They restored the temple. = The temple was restored.
Make words: educate, education, educational; apply, application, applicant.|Applicants fill in an application form for the scholarship.
Useful phrasal verbs: move out, grow up, cope with, rely on.|When you grow up and move out, you rely on yourself.
Use consequently, as a result and moreover to build an argument.|Poverty limits education; consequently, opportunities shrink.
Use the with systems and unique natural things (the ecosystem, the food chain).|Predators keep the food chain balanced.`,
12:`Use the past simple for events and the past perfect for earlier events.|She had worked for years before she won the award.
Use fixed prepositions: tolerance of, respect for, differences between, adapt to.|Respect for differences helps people adapt to a new culture.
Unless means if not. Use if + present simple with will or the present simple for facts.|Unless we reduce waste, landfills will keep growing.
Form nouns: urbanise, urbanisation; migrate, migration. Adjectives: urban, overcrowded.|Rapid urbanisation causes overcrowded cities.
Useful phrasal verbs: apply for, take on, work out, step down.|She applied for an internship and took on extra tasks.
Rewrite with the passive, reported speech and relative clauses.|AI will replace routine jobs. = Routine jobs will be replaced by AI.
Use whereas, nevertheless and in addition to organise opinions.|Print news is slower; nevertheless, it is often more detailed.
Third and mixed conditionals show consequences: if + had + past participle, would + verb.|If poaching had been controlled, more tigers would survive today.
Rewrite with the passive, gerunds and so...that.|He worked so hard that he was promoted quickly.
Form words: learn, learner; skill, skilled; curious, curiosity.|Curiosity keeps learners skilled and motivated.`};

Object.assign(LSN,{7:`Use the present simple for habits and facts. Add -s or -es for he, she and it, and use do or does for questions and negatives.|My sister collects stamps, but she doesn't collect coins.
A simple sentence has one subject and one or more verbs. It can also have an object and an adverb of time.|I read science books every weekend and sleep at ten.
Use the past simple for finished actions. Regular verbs add -ed, and many common verbs are irregular (go, went).|We cleaned the beach last Sunday and collected a lot of rubbish.
Compare with like, different from and (not) as...as. Use -er or more for comparatives and -est or most for superlatives.|Her voice is not as strong as his, and it is different from other singers.
Use some in positive sentences and offers. Use a lot of or lots of with plural and uncountable nouns.|We need some rice and a lot of vegetables for the soup.
Use at for times and points, on for days and surfaces, in for months, years and spaces.|The visit starts at 8 a.m. on Friday, and we meet in the hall.
Use should and shouldn't for advice. For distance, say: It is + distance + from A to B.|You should wear a helmet. It is two kilometres from my house to school.
Show contrast with although and though (before a clause) and however (starts a new sentence, followed by a comma).|Although the film was long, I enjoyed it. However, the ending was sad.
Make yes/no questions with be, a modal or do, does or did before the subject. Answer with Yes or No + subject + auxiliary.|Do people wear costumes at this festival? Yes, they do.
Use am, is or are + verb-ing for actions happening now or around now.|The engineers are testing a new solar panel at the moment.
Use will + verb for predictions. Possessive pronouns (mine, yours, his, hers, ours, theirs) replace a possessive adjective + noun.|Flying cars will be common. This seat is mine, and that one is yours.
Use a or an for one of many, the for known or unique things, and no article for general plurals and uncountable nouns.|I read a book about the UK. The book was interesting.`.split("\n"),
8:`After like, love, enjoy, hate and dislike, use verb-ing for general feelings. Use to + verb for a particular occasion.|I enjoy swimming, but today I would like to go cycling.
Form comparative adverbs with -er (short) or more (long): faster, more carefully. Well becomes better.|Villagers work harder and live more slowly than city people.
A compound sentence joins two clauses with and, but, or or so. A simple sentence has only one clause.|Teenagers want independence, but they still need advice.
Yes/no questions start with an auxiliary. Wh- questions start with what, where, why, who or how. Use many with countable and much with uncountable nouns.|How many festivals do you have? How much rice do you need?
Use a or an for the first mention, the for the second mention, and no article for general plurals and meals.|We visited a village. The village has an old temple.
Use will for future results. First conditional: if + present simple, will + verb.|If you eat more vegetables, you will feel healthier.
Link time with when, before, after, while, until and as soon as. Use the present simple after them for the future.|I will recycle the bottles as soon as I finish the drink.
Adverbs of frequency (always, usually, often, sometimes, never) go before the main verb. The present simple can also show a timetable.|The market usually opens at six. The sale starts next Monday.
Use was or were + verb-ing for an action in progress in the past, often interrupted by a past simple action.|We were sleeping when the storm hit the village.
Use in for months and years, on for days, at for times. Possessive pronouns: mine, yours, his, hers, ours, theirs.|The meeting is on Friday at nine. That phone is yours, and this one is mine.
In reported statements the verb usually moves one tense back, and pronouns and time words change.|"I am testing the robot," she said. = She said that she was testing the robot.
In reported yes/no questions use if or whether. In wh- questions keep the question word. The word order is that of a statement.|"Are you coming?" = He asked if I was coming.`.split("\n")});
LSN[11][0]="Use the past simple for finished time and the present perfect (have + past participle) for experiences and results connected to now.|I have exercised since 2020, and I started jogging last year.";
LSN[11][1]="Modal verbs (can, may, must, have to, need) show ability, permission, obligation and necessity.|You must follow the rules, but you don't have to agree with every one.";
LSN[11][2]="Stative verbs (know, like, believe, want) are not normally used in continuous forms. Linking words join ideas: and, but, so, because, however.|I know the city well, but I don't like the traffic.";

LSN[9][0]="Use a question word + to-infinitive after ask, wonder, decide, tell and know. Phrasal verbs combine a verb and a particle (look around, turn down).|She wondered where to go. I turned down the offer.";
LSN[9][1]="Double comparatives show that two changes happen together: the + comparative, the + comparative.|The more we walk, the healthier we feel. The city is getting busier and busier.";
LSN[9][2]="Modal verbs can appear in the main clause of a conditional: can, could, may, might, should, must.|If Anna wakes up early, she can go for a run. If you feel stressed, you should talk to someone.";
LSN[9][4]="Use the present perfect (have or has + past participle) for experiences and results connected to now, with ever, never, already, yet, since and for.|I have never tried rock climbing. She has already finished her project.";
LSN[10][0]="Use the present simple for habits and facts, and the present continuous for actions now or around now.|My dad usually cooks, but this week he is working late.";
LSN[10][2]="A compound sentence joins two clauses with and, but, or, so. After modal verbs and after let or make, use the bare infinitive; use the to-infinitive for purpose.|I like jazz, but my sister prefers rock. We came to listen to the concert.";
LSN[11][3]="A gerund (verb-ing) works like a noun: as a subject, after prepositions, and after verbs such as enjoy, mind and avoid.|Being honest is important. They are interested in finding a solution.";
LSN[11][4]="Present participles (-ing) and past participles (-ed or -en) can work as adjectives or shorten clauses.|The children playing outside are my cousins. The window broken by the storm is repaired.";
LSN[11][5]="A to-infinitive clause can show purpose or follow nouns such as the first, the last and the best.|I studied hard to pass the exam. She is the first student to finish.";
LSN[11][6]="Perfect gerunds and perfect participle clauses (having + past participle) show an action that happened earlier.|Having finished the work, he went home. She denied having taken the money.";
LSN[11][7]="Cleft sentences emphasise one part: It + be + the emphasised part + that or who + clause.|It was Tom who won. It was at the shop that I left my bag.";
LSN[11][8]="Linking words connect ideas: because, since, although, despite, in order to, moreover, therefore, as a result.|Despite the rain, they finished the marathon. He studied hard; therefore, he passed.";
LSN[11][9]="A compound noun joins two words into one meaning: noun + noun (sunscreen), adjective + noun (hot dog), or hyphenated forms (passer-by).|I need sunscreen, and we will watch the elephant show at the zoo.";
LSN[12][0]="Use the past simple for completed events and the past continuous for an action in progress when another event happened.|She was studying when the news arrived. He won the prize in 2015.";
LSN[12][1]="Review the articles: a or an for a first mention, the for known or unique things, and no article for general plurals and uncountable nouns.|A festival was held in the city. The festival celebrated cultural diversity.";
LSN[12][4]="A simple sentence has one clause, a compound sentence joins clauses with and, but, or, so, and a complex sentence has a main and a dependent clause.|I applied, and I got an interview. Although the job was demanding, she accepted it.";

LES.push(["Present simple","Habits, routines and facts: I walk to school. The Earth goes round the Sun.|Add -s or -es for he, she, it. Questions and negatives use do or does + the base verb.|Frequency adverbs (always, usually, often, sometimes, never) go before the main verb but after be.|Time words: every day, on Mondays, once a week.","s:presentSimple"],
["Present continuous","Use am, is or are + verb-ing for actions happening now or around now.|Negative: is not working. Question: Are they playing?|Contrast: She usually walks, but today she is taking the bus.|Stative verbs (know, like, want) are not normally used in the continuous.","s:presentCont"],
["Past simple","Finished actions at a known time: We visited Hue last year.|Regular verbs add -ed; irregular verbs change (go, went; see, saw).|Questions and negatives use did or didn't + the base verb.|Time words: yesterday, last week, in 2019, two days ago.","s:pastSimple"],
["Past continuous","Use was or were + verb-ing for an action in progress at a past moment.|It is often interrupted by a past simple action: We were eating when the lights went out.|While links two actions in progress; when often introduces the interruption.|Compare: I read a book (finished) and I was reading a book (in progress).","s:pastCont"],
["Future forms","Will + verb: predictions and quick decisions (It will rain).|Be going to: plans and evidence (Look at the clouds, it is going to rain).|The present simple for timetables: The train leaves at eight.|After if, when and as soon as, use the present simple, not will.","s:futures"],
["Comparisons","Short adjectives: taller, the tallest. Long adjectives: more interesting, the most interesting.|Equality: as + adjective + as. Difference: different from, not as ... as.|Irregular forms: good, better, best; bad, worse, worst.|Double comparatives: The more you practise, the better you become.","s:comparison"],
["Quantifiers","Countable nouns: many, a few, several. Uncountable nouns: much, a little.|Both kinds: some, any, a lot of, lots of, plenty of.|Use some in positive sentences and offers, and any in negatives and questions.|How many goes with countable nouns; how much goes with uncountable nouns.","s:quantifiers"],
["Modal verbs","Can and could: ability and permission. Must and have to: obligation. Should: advice.|Mustn't means not allowed; don't have to means not necessary.|May, might and could show possibility. A modal is followed by the base verb.|Modals also appear in conditionals: If you feel ill, you should rest.","s:modals"],
["Question forms","Yes/no questions put an auxiliary or modal before the subject: Do you like tea?|Wh- questions use what, where, when, why, who or how + auxiliary + subject.|How many goes with countable nouns, how much with uncountable nouns, how often with frequency.|Short answers repeat the auxiliary: Yes, I do. No, she isn't.","s:questions"],
["Possessives","Possessive adjectives come before a noun: my, your, his, her, its, our, their.|Possessive pronouns stand alone: mine, yours, his, hers, ours, theirs.|Compare: This is my book. This book is mine.|Use 's for one owner (Mai's bag) and s' for plural owners (the students' room).","s:possessives"],
["Verb + -ing / to","Enjoy, mind, avoid, finish and keep take verb-ing.|Want, hope, decide, learn and plan take to + the base verb.|Like, love, hate and prefer can take either; would like takes the to-infinitive.|A gerund can be a subject or follow a preposition: Being honest matters. He is good at drawing.","s:gerunds"],
["Sentence types","A simple sentence has one clause. A compound sentence joins clauses with and, but, or, so.|A complex sentence has a main clause and a dependent clause (because, although, when, until).|Time clauses use the present simple for the future: I will call you when I arrive.|Contrast: although or though + a clause; however starts a new sentence.","s:sentences"],
["Reported speech","Reporting verbs (said, told, asked) usually move the tense back: am becomes was, will becomes would.|Pronouns and time words change: I becomes he or she, tomorrow becomes the next day.|Yes/no questions use asked if or whether + statement order. Wh- questions keep the question word.|Example: 'Where do you live?' becomes She asked where I lived.","s:reported"],
["Past vs perfect","Past simple: a finished time (I lost my keys yesterday).|Present perfect: a connection to now, with just, already, yet, ever, never, for and since.|Form it with have or has + the past participle: I have lived here for five years.|Do not use the present perfect with a finished time word such as yesterday or in 2019.","s:perfect"],
["Participles","The present participle (-ing) is active: the girl standing there; an exciting film.|The past participle (-ed or -en) is passive or finished: the broken window; a tired student.|Participle clauses shorten sentences: Being tired, she went to bed.|Compare -ing and -ed adjectives: boring (causes the feeling) and bored (has the feeling).","s:participles"],
["Infinitives","After modals and after let or make, use the bare infinitive: She made me laugh.|Use the to-infinitive for purpose: I went there to study.|Use it after adjectives and ordinals: easy to use, the first to arrive.|Many verbs take the to-infinitive: want, decide, hope, plan, promise.","s:infinitives"],
["Perfect gerund and participle clauses","Having + the past participle shows an action finished before the main action.|Having finished the report, she went home.|The perfect gerund follows admit, deny, regret and remember: He denied having taken it.|Use these clauses to join sentences that share the same subject.","s:perfectClauses"],
["Cleft sentences","A cleft sentence emphasises one part of a sentence.|Pattern: It + be + the emphasised part + that or who + a clause.|Emphasise the subject: It was Tom who won. Emphasise a place: It was at the shop that I left it.|Use who for people and that for things, places and times.","s:cleft"],
["Compound nouns","A compound noun joins two words into one idea: sunscreen, haircut, bus stop.|Types: closed (snowfall), open (town square) and hyphenated (passer-by, sister-in-law).|The first word usually describes the second, and the stress is usually on the first part.|The plural goes on the main noun: sisters-in-law, passers-by.","s:compoundNouns"],
["Question word + to-infinitive","After ask, wonder, know, decide and tell, use a question word + to + the base verb.|She didn't know what to do. Tell me how to get there.|It shortens a clause: Tell me where I should go becomes Tell me where to go.|Use where, what, which, when, how and who; why is rare.","s:whToInf"]);

<script>
/* ===== WORD STUDIO: learners describe a topic or difficult words; AI builds a tailored practice set =====
   The AI runs on the English Trainer app server (key stays on the server). Saved words go into My words. */
const WS_URL="https://project--1c9d08cc-37dc-4369-9d32-9c31acb4e928.lovable.app/api/public/practice";
const WS={req:"",lv:"Intermediate",busy:0,err:"",set:null,tab:"words",flip:{},qa:{},fa:{},fc:{}};
const WS_IDEAS=["Unit 3: My friends — personality words","environment, pollution, recycle, endangered","Words for describing feelings at school","Travel and asking for directions"];
function wsSay(t){try{let u=new SpeechSynthesisUtterance(t);u.lang="en-GB";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function wsSaved(w){return (S.ws||[]).some(x=>x.word.toLowerCase()==w.toLowerCase())}
function studio(){let s=WS.set,h=`<div class="row"><button data-v="home">Home</button><span class="chip">✨ Word Studio</span></div>
<div class="ws-hero"><span class="ws-kick">AI practice set</span><h2>Word Studio</h2><p class="mu">Describe a topic, or paste words you find difficult. You'll get flip cards, a quiz and fill-in practice made just for you.</p>
<textarea id="ws-req" maxlength="1500" placeholder="e.g. affect, effect, borrow, lend — or “Unit 5: Food and drink”">${esc(WS.req)}</textarea>
<div class="ws-ideas">${WS_IDEAS.map((x,i)=>`<button data-ws="idea" data-i="${i}">${esc(x)}</button>`).join("")}</div>
<div class="ws-lv seg">${["Beginner","Intermediate","Advanced"].map(l=>`<button class="${WS.lv==l?"p":""}" data-ws="lv" data-l="${l}">${l}</button>`).join("")}</div>
<button class="p ws-go" data-ws="gen" ${WS.busy?"disabled":""}>${WS.busy?"Creating your set…":"✨ Create my practice set"}</button>
${WS.busy?'<div class="ws-load"><span class="ws-sp"></span>Your teacher is writing cards and questions. This takes a few seconds.</div>':""}
${WS.err?`<div class="ws-err">${esc(WS.err)}</div>`:""}</div>`;
 if(!s)return h;
 h+=`<div class="card"><h2>${esc(s.title)}</h2><p class="mu">${esc(s.summary)}</p><div class="ws-tabs seg">${[["words","Words"],["quiz","Quiz"],["fill","Fill in"]].map(([k,v])=>`<button class="${WS.tab==k?"p":""}" data-ws="tab" data-t="${k}">${v}</button>`).join("")}</div>`;
 if(WS.tab=="words"){h+=`<div class="ws-grid">${s.words.map((w,i)=>`<div class="ws-card ${WS.flip[i]?"f":""}" data-ws="flip" data-i="${i}"><div class="ws-in"><div class="ws-face"><span class="ws-pos">${esc(w.partOfSpeech)}</span><div class="ws-w">${esc(w.word)}</div><div class="ws-ipa">${esc(w.ipa)}</div><div class="ws-acts"><button data-ws="say" data-i="${i}">🔊 Listen</button><button data-ws="keep" data-i="${i}" ${wsSaved(w.word)?"disabled":""}>${wsSaved(w.word)?"✓ Saved":"＋ My words"}</button></div><div class="ws-hint">Tap to flip</div></div><div class="ws-face ws-back"><b>${esc(w.meaning)}</b><p><i>“${esc(w.example)}”</i></p><p>💡 ${esc(w.tip)}</p></div></div></div>`).join("")}</div><div class="row"><button data-ws="keepall">＋ Save all to My words</button></div>`}
 else if(WS.tab=="quiz"){let sc=Object.keys(WS.qa).filter(i=>WS.qa[i]==s.quiz[i].answerIndex).length;
  h+=`<p class="ws-score">${sc} / ${s.quiz.length} correct</p>`+s.quiz.map((q,i)=>{let a=WS.qa[i];return`<div class="ws-q"><b>${i+1}. ${esc(q.question)}</b><div class="ws-opts">${q.options.map((o,j)=>`<button class="${a==null?"":j==q.answerIndex?"ok":j==a?"no":""}" data-ws="ans" data-i="${i}" data-j="${j}" ${a!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>${a!=null?`<div class="ws-ex">${a==q.answerIndex?"✓ Correct. ":"✗ Not quite. "}${esc(q.explanation)}</div>`:""}</div>`}).join("")}
 else{h+=s.fillIns.map((f,i)=>{let c=WS.fc[i];return`<div class="ws-q ws-fi"><b>${i+1}. ${esc(f.sentence)}</b><input id="ws-f${i}" value="${esc(WS.fa[i]||"")}" class="${c==null?"":c?"ok":"no"}" placeholder="Type the missing word" aria-label="Answer ${i+1}"><div class="ws-acts"><button data-ws="chk" data-i="${i}">Check</button><button data-ws="show" data-i="${i}">Hint</button></div>${c===false?`<div class="ws-ex">Answer: <b>${esc(f.answer)}</b></div>`:WS.fh&&WS.fh[i]?`<div class="ws-ex">💡 ${esc(f.hint)}</div>`:""}</div>`}).join("")}
 return h+`<div class="row"><button data-ws="new">Start a new set</button></div></div>`}
async function wsGen(){let r=$("#ws-req");WS.req=r?r.value.trim():WS.req;if(WS.req.length<2){WS.err="Please describe a topic or type a few words first.";draw();return}
 WS.busy=1;WS.err="";draw();
 try{let res=await fetch(WS_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({request:WS.req,level:WS.lv})}),j=await res.json();
  if(j.ok){WS.set=j.set;WS.tab="words";WS.flip={};WS.qa={};WS.fa={};WS.fc={};WS.fh={}}else WS.err=j.error||"Couldn't create a practice set. Please try again."}
 catch(e){WS.err="Couldn't reach Word Studio. Check your internet connection and try again."}
 WS.busy=0;draw()}
function wsKeep(w){S.ws=S.ws||[];if(!wsSaved(w.word))S.ws.push({word:w.word,meaning:w.meaning,example:w.example});S.v[w.word]=S.v[w.word]||{b:0,m:0}}
document.addEventListener("click",e=>{let t=e.target.closest("[data-ws]");if(!t||view!="studio")return;let D=t.dataset,i=+D.i,s=WS.set;e.stopPropagation();
 let r=$("#ws-req");if(r)WS.req=r.value;
 if(D.ws=="idea"){WS.req=WS_IDEAS[i];draw()}else if(D.ws=="lv"){WS.lv=D.l;draw()}else if(D.ws=="gen")wsGen();
 else if(D.ws=="tab"){WS.tab=D.t;draw()}else if(D.ws=="flip"){WS.flip[i]=!WS.flip[i];let c=t;c.classList.toggle("f")}
 else if(D.ws=="say")wsSay(s.words[i].word+". "+s.words[i].example);
 else if(D.ws=="keep"){wsKeep(s.words[i]);save();draw()}else if(D.ws=="keepall"){s.words.forEach(wsKeep);save();draw()}
 else if(D.ws=="ans"){WS.qa[i]=+D.j;draw()}
 else if(D.ws=="chk"){let v=($("#ws-f"+i)||{}).value||"";WS.fa[i]=v;WS.fc[i]=v.trim().toLowerCase()==s.fillIns[i].answer.trim().toLowerCase();draw()}
 else if(D.ws=="show"){WS.fa[i]=($("#ws-f"+i)||{}).value||"";WS.fh=WS.fh||{};WS.fh[i]=1;draw()}
 else if(D.ws=="new"){WS.set=null;WS.req="";window.scrollTo(0,0);draw()}},true);
/* Hook Word Studio into navigation and My words */
const _wsWords=words;words=function(){if(view=="studio")return studio();let h=_wsWords(),l=S.ws||[];
 if(!l.length)return h;return h.replace(/<\/div>$/,`<p><b>✨ From Word Studio</b><br>${l.map(w=>`<span title="${esc(w.meaning)}">${esc(w.word)}</span>`).join(", ")}</p></div>`)};
</script>
</body></html>
