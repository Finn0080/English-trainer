name: Update daily exercises
on:
  schedule: [{cron: "5 0 * * *"}]   # every day, 00:05 UTC
  workflow_dispatch:                # lets you run it by hand
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python make_feed.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "feed-bot"; git config user.email "tunglamisfinn@gmail.com"
          git add feed.json; git diff --cached --quiet || (git commit -m "Update daily exercises" && git push)
