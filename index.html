7:`Use the present simple for habits and the present continuous for actions now.|I collect stamps on Sundays, and I am sorting my stamps now.
Use a or an for one of many things, the for something known, and no article for general ideas.|I eat an apple and the snack in my bag; fruit keeps me healthy.
Learn fixed pairs: volunteer at, donate to, clean up, take part in.|We took part in a clean-up and donated clothes to a charity.
Change the word class: perform, performer, performance; talent, talented.|The talented performer gave a great performance at the exhibition.
Use some or any with uncountable food, and a or an before singular countable nouns.|I need an onion and some oil, but there isn't any salt.
Use the past simple to tell the story of a visit.|We visited the laboratory and had lunch in the canteen.
Use prepositions of movement: across, along, through, at the junction.|Walk along the pavement and cross at the junction.
Link ideas with and, but, so, because and although.|I liked the plot because it was exciting, but the ending was sad.
Common phrasal verbs for events: set off, take part in, dress up, look forward to.|People dress up and take part in the parade.
Make adjectives and nouns: renewable, electricity, electric, electrical.|Solar power is renewable, so it protects the environment.
Use will and might for predictions. First conditional: if + present simple, will + verb.|If cars become driverless, journeys will be safer.
Use the with some places (the UK, the USA) but not with most countries.|London is the capital of the UK, and Canada is a large country.`,
8:`After like, love, enjoy and be keen on, use verb-ing.|She is keen on cycling and enjoys exploring new roads.
Use prepositions with places: in the village, on a farm, near the river, from the city.|Farmers live on farms near the river and work in the fields.
Form words: confident, confidence; independent, independence.|Teenagers need independence, but they also feel pressure.
Use the with groups and unique things (the highlands). Plural general nouns take no article.|Many families live in stilt houses in the mountains.
Useful phrasal verbs: bring up, hand down, die out, look up to.|Customs are handed down, so we look up to our ancestors.
Use however, therefore and besides to link sentences.|He sleeps late; however, he keeps a healthy routine.
First conditional for real results: if + present simple, will + verb.|If we recycle more, we will reduce pollution.
Prepositions of price and place: on sale, at a discount, for five dollars, in the shop.|The shoes were on sale at a discount, so I bought them for half price.
Use the past continuous for background and the past simple for sudden events.|We were sleeping when the earthquake struck.
Second conditional for unreal ideas: if + past simple, would + verb.|If we had holograms, we would talk face to face from anywhere.
Form nouns from verbs: invent, invention; discover, discovery; develop, development.|The invention of the phone was a breakthrough in communication.
Reported speech moves the tense back: is becomes was.|"There is water on Mars," she said. = She said that there was water on Mars.`,
9:`Phrasal verbs for community life: set up, carry on, pass down, hand down.|Artisans pass down their skills and carry on the craft.
Use prepositions of place and movement: in the city centre, on the metro, through the park, across the bridge.|I take the metro across the river every morning.
The present perfect links the past and now: have + past participle.|I have joined a club, so I have felt less stressed since then.
Use used to + verb for past habits that have stopped.|We used to play outside until dark, but now we play online.
Use the present perfect for experiences with ever, never, already and yet.|Have you ever tried a new sport? I have never been camping.
Rewrite with used to, comparatives and the passive.|People used to travel by bike. = Bikes were once the usual transport.
Use the with unique natural features (the Amazon, the Pacific), but not with most single mountains.|We visited the Grand Canyon and climbed Mount Fuji.
Use a or an for singular countable nouns, and no article for general plurals.|Tourists need a map and an itinerary, and they enjoy sightseeing.
Use although, despite and whereas to show contrast.|Although accents differ, people still understand each other.
Second conditional for unreal present situations: if + past simple, would + verb.|If we stopped burning coal, the climate would improve.
Make words with -able, -less and -er: wireless, rechargeable, user.|A wireless charger is useful, but a rechargeable battery is better.
Rewrite using the passive and gerunds.|They will train the apprentices. = The apprentices will be trained.`,
10:`Use the present simple for routines and the present continuous for temporary changes.|My mother cooks dinner, but this week my father is cooking.
First conditional for real results: if + present simple, will + verb.|If we save energy, we will cut emissions.
Make nouns for people and things: compose, composer; perform, performance.|The composer wrote a melody that suits the lyrics.
Useful phrasal verbs: set up, give out, clean up, take on.|Students set up a club and gave out leaflets.
Use the past simple passive for inventions and the present perfect passive for change up to now.|The telephone was invented in 1876 and has been improved ever since.
Use whereas, while and in contrast to compare groups.|Some jobs once needed men, whereas today they are open to everyone.
Use prepositions with organisations: member of, cooperation with, belong to.|Viet Nam is a member of the UN and cooperates with many countries.
Form adjectives and adverbs: interactive, effective, effectively.|Interactive lessons help students learn effectively.
Second conditional: if + past simple, would + verb. Unless means if not.|If more people used buses, there would be less pollution.
Use the with places already mentioned and zero article for general ideas.|Ecotourism protects nature, so the local area benefits.`,
11:`Use the past simple for finished time and the present perfect for experience up to now.|I have exercised since 2020, and I started jogging last year.
Use but, however, even though and whereas to show differences between generations.|Teenagers like fast change, whereas grandparents prefer routine.
Use first and second conditionals for predictions and ideas.|If cities used more green energy, they would be cleaner.
Use prepositions with regional ideas: member of, relations with, cooperation among, benefit from.|Viet Nam benefits from cooperation among ASEAN members.
Third conditional for past regrets: if + had + past participle, would have + past participle.|If we had cut emissions earlier, temperatures would have risen less.
Rewrite using the passive and have something done.|They restored the temple. = The temple was restored.
Make words: educate, education, educational; apply, application, applicant.|Applicants fill in an application form for the scholarship.
Useful phrasal verbs: move out, grow up, cope with, rely on.|When you grow up and move out, you rely on yourself.
Use consequently, as a result and moreover to build an argument.|Poverty limits education; consequently, opportunities shrink.
Use the with systems and unique natural things (the ecosystem, the food chain).|Predators keep the food chain balanced.`,
12:`Use the past simple for events and the past perfect for earlier events.|She had worked for years before she won the award.
Use fixed prepositions: tolerance of, respect for, differences between, adapt to.|Respect for differences helps people adapt to a new culture.
Unless means if not. Use if + present simple with will or the present simple for facts.|Unless we reduce waste, landfills will keep growing.
Form nouns: urbanise, urbanisation; migrate, migration. Adjectives: urban, overcrowded.|Rapid urbanisation causes overcrowded cities.
Useful phrasal verbs: apply for, take on, work out, step down.|She applied for an internship and took on extra tasks.
Rewrite with the passive, reported speech and relative clauses.|AI will replace routine jobs. = Routine jobs will be replaced by AI.
Use whereas, nevertheless and in addition to organise opinions.|Print news is slower; nevertheless, it is often more detailed.
Third and mixed conditionals show consequences: if + had + past participle, would + verb.|If poaching had been controlled, more tigers would survive today.
Rewrite with the passive, gerunds and so...that.|He worked so hard that he was promoted quickly.
Form words: learn, learner; skill, skilled; curious, curiosity.|Curiosity keeps learners skilled and motivated.`};

const uTab=g=>`<div class="card"><h2>Units · Grade ${g}</h2>${GSU[g].map((u,i)=>{let ls=!u.f&&LES.find(x=>x[2]=="s:"+(u.k=="articles"?"prepositions":u.k));return`<details><summary>Unit ${i+1}: ${esc(u.t)}${gbest(g,i+1)}</summary>${u.f?`<p><b>Practice focus:</b> ${esc(u.f)}</p><p>${esc(u.l)}</p>`:`<p><b>Practice focus:</b> ${esc(SKN[u.k])}</p>${lsn(g,i)}${ls?"<p><b>Skill notes</b></p><ul>"+ls[1].split("|").map(t=>"<li>"+esc(t)+"</li>").join("")+"</ul>":""}`}<p><b>Key words</b></p><ul>${u.w.map(w=>"<li><b>"+esc(w[0])+"</b>: "+esc(w[1])+"</li>").join("")}</ul><div class="row"><button class="p" data-gs="${i+1}">Practise (10 questions)</button></div></details>`}).join("")}</div><div class="card"><h2>Grade ${g} sub-skills</h2><p class="mu">Targeted practice at the level this grade works toward (${LV[GL[g]]}).</p><div class="row">${Object.entries(SKN).map(([k,v])=>`<button data-gsk="${k}">${v}</button>`).join("")}</div></div>`;
const gTab=g=>`<div class="card"><h2>Grammar · Grade ${g}</h2><p class="mu">One grammar focus per unit, with a short rule, an example and practice.</p><div class="row"><button class="p" data-gx="gall">Mixed grammar review (10)${gbest(g,"gall")}</button></div>${GSU[g].map((u,i)=>`<details><summary>Unit ${i+1}: ${esc(u.t)} · ${esc(u.f||SKN[u.k])}${gbest(g,"g"+(i+1))}</summary>${u.f?`<p>${esc(u.l)}</p>`:lsp(g,i)}<div class="row"><button class="p" data-gx="g${i+1}">Practise this grammar</button></div></details>`).join("")}</div>`;
const vTab=g=>`<div class="card"><h2>Vocabulary · Grade ${g}</h2><p class="mu">${gwords(g).length} key words from ${GSU[g].length} units.</p><div class="row"><button class="p" data-gx="vall">Mixed vocabulary quiz (10)${gbest(g,"vall")}</button><button data-gfl="1">Flashcards</button></div>${GSU[g].map((u,i)=>`<details><summary>Unit ${i+1}: ${esc(u.t)}${gbest(g,"v"+(i+1))}</summary><ul>${u.w.map(w=>"<li><b>"+esc(w[0])+"</b>: "+esc(w[1])+"</li>").join("")}</ul><div class="row"><button class="p" data-gx="v${i+1}">Practise these words</button></div></details>`).join("")}</div>`;
const rTab=g=>`<div class="card"><h2>Review · Grade ${g}</h2><p class="mu">20 questions mixing the vocabulary and grammar of all ${GSU[g].length} units.${gbest(g,"rev")?" Best"+gbest(g,"rev").slice(2)+".":""}</p><div class="row"><button class="p" data-gx="rev">Start review test</button></div></div>`;
function schoolHome(){let g=S.gr||6,t=S.gt||"units",body=t=="grammar"?gTab(g):t=="vocab"?vTab(g):t=="review"?rTab(g):uTab(g);
 return`<div class="hd"><div><h1>English Trainer</h1><p class="mu">Global Success practice, grade by grade.</p></div><span class="chip">Best streak ${S.bs}</span></div>${tabs()}<div class="row">${[6,7,8,9,10,11,12].map(x=>`<button class="${x==g?"p":""}" data-gr="${x}">Grade ${x}</button>`).join("")}</div><div class="row">${GT.map(([k,v])=>`<button class="${t==k?"p":""}" data-gt="${k}">${v}</button>`).join("")}</div><p class="mu">${GNOTE}</p>${body}<div class="row"><button data-v="lessons">Lessons</button><button data-gfl="1">Flashcards</button><button data-v="words">My words</button></div>`}
/* ===== 6. UI RENDERING ===== */
function draw(){let h="";
 if(view=="home")h=home();else if(view=="round")h=round();else if(view=="end")h=end();else if(view=="flash")h=flash();else if(view=="tutor")h=tutor();else if(view=="lessons")h=lessons();else h=words();
 $("#app").innerHTML=h;wire()}
function home(){if(S.tab=="school")return schoolHome();let cells=tl().map(l=>"<tr><th>"+l+"</th>"+MD.map(m=>{let p=S.p[l+m],ok=unlocked(l);return`<td><button style="--p:${p||0}" data-go="${l}|${m}" ${ok?"":"disabled"} title="${ok?"":"Locked: pass the previous level first"}">${p!=null?p+"%":ok?"–":"🔒"}</button></td>`}).join("")+"</tr>").join("");
 return`<div class="hd"><div><h1>English Trainer</h1><p class="mu">Pick a level and a module. Pass marks rise from 70% to 85%, and B2 and above are timed.</p></div><span class="chip">Best streak ${S.bs}</span></div>
${tabs()}${dcard()}${scard()}${ecard()}<div class="card"><table><tr><th></th>${MD.map(m=>"<th>"+MN[m]+"</th>").join("")}</tr>${cells}</table>
<div class="row"><label><input type="checkbox" id="pl" ${S.pl?"checked":""}> Placement: unlock all levels</label></div></div>
<div class="row"><button class="p" data-test="1">Level test</button>${PROXY_URL?'<button data-v="tutor">Ask the tutor</button>':""}<button data-v="lessons">Lessons</button><button data-v="flash">Flashcards</button><button data-v="words">My words</button><button id="rs">Reset progress</button></div>
<p class="mu">Speech features need a browser with speech synthesis/recognition (Chrome, Edge, Safari).</p>`}
function round(){let it=R.q[R.i]||(R.q[R.i]=R.endless?enext():tnext(R.i)),pct=Math.round(100*R.i/R.q.length),b="";
 if(it.say)b+=`<div class="row"><button data-say="${esc(it.say)}">▶ Play</button><button data-say="${esc(it.say)}" data-slow="1">Slow</button><label class="mu">Speed <input type="range" id="rt" min=".5" max="1.3" step=".1" value="${rate}"></label></div>`;
 if(it.text)b+=`<p>${esc(it.text)}</p>`;
 b+=`<p><b>${esc(it.q)}</b></p>`;
 if(it.t=="write")b+=`<textarea id="wr" aria-label="Your answer"></textarea><p class="mu" id="cl">${cl("",it)}</p><div class="row"><button class="p" id="ck">Check</button></div>`;
 if(it.h)b+=`<p class="mu">${esc(it.h)}</p>`;
 if(it.t=="mc")b+=`<div class="opts">${it.o.map((o,i)=>`<button data-o="${i}">${esc(o)}</button>`).join("")}</div>`;
 if(it.t=="type")b+=`<input type="text" id="tx" autocomplete="off" aria-label="Your answer"><div class="row"><button class="p" id="ck">Check</button></div>`;
 if(it.t=="order")b+=`<div class="row" id="pool">${it.w.map((w,i)=>`<button data-w="${i}">${esc(w)}</button>`).join("")}</div><p id="sel" class="mu" style="min-height:1.5em"></p><div class="row"><button id="un">Undo</button><button class="p" id="ck">Check</button></div>`;
 if(it.t=="speak")b+=`<div class="row"><button data-say="${esc(it.a)}">▶ Hear it</button><button data-say="${esc(it.a)}" data-slow="1">Slow</button>${SR?'<button class="p" id="rec">● Record</button>':""}</div>${SR?"":'<p class="mu">Speech recognition is not supported here. Say it aloud, then rate yourself.</p><div class="row"><button data-self="1">I said it well</button><button data-self="0">Needs work</button></div>'}`;
 return`<div class="row"><button data-v="home">Home</button><span class="chip">${R.tst?"Level test · "+SK[it.k]:R.endless?"Endless · "+R.l+" · "+EM[R.m]:R.l+" · "+MN[R.m]}</span><span class="mu" id="es">${R.endless?estat():R.i+1+"/"+R.q.length+" · score "+R.sc+" · streak "+R.st}</span></div><div class="bar" role="progressbar" aria-valuenow="${pct}"><i ${R.endless||R.timed?'id="tb" style="width:100%"':'style="width:'+pct+'%"'}></i></div>
<div class="card">${b}<div class="fb" id="fb" aria-live="polite"></div><div class="row"><button class="p" id="nx" hidden>${R.endless||R.i+1<R.q.length?"Next":"Finish"}</button></div></div>`}
function end(){if(R.tst)return tend();if(R.endless)return eend();let n=R.q.length,p=Math.round(100*R.sc/n),i=LV.indexOf(R.l),nx=i<LV.length-1&&p>=PASS[i];
 return`<h2>${R.l} · ${MN[R.m]}: ${p}%</h2><div class="card"><p>${R.sc} of ${n} correct. Best streak ${R.bs||0}.</p>${R.ms.length?"<p class='mu'>Missed:</p><ul>"+R.ms.map(m=>"<li>"+esc(m)+"</li>").join("")+"</ul>":"<p>No mistakes.</p>"}
<div class="row"><button class="p" data-go="${R.l}|${R.m}">Try again</button>${nx?`<button data-go="${LV[i+1]}|${R.m}">Next level</button>`:""}<button data-v="home">Home</button></div></div>`}
function flash(){let ws=fw();R=R&&R.f?R:{f:1,i:0,fl:0};let w=ws[R.i%ws.length];
 return`<div class="row"><button data-v="home">Home</button><span class="mu">Card ${R.i%ws.length+1}/${ws.length}</span></div><div class="card flip"><div id="fc" tabindex="0" role="button" style="transform:rotateY(${R.fl?0:0}deg)">${R.fl?`<p>${esc(w[1])}</p><p class="mu">${esc(w[2])}</p>`:`<h2>${esc(w[0])}</h2><p class="mu">${esc(w[3])}</p>`}<p class="mu">(tap to flip)</p></div>
<div class="row"><button data-k="1">Know it</button><button data-k="0">Still learning</button><button data-say="${esc(w[0])}">▶</button></div></div>`}
function words(){let all=Object.values(DATA).flatMap(d=>d.W.map(w=>w[0])),g=(f)=>all.filter(w=>S.v[w]&&f(S.v[w])).join(", ")||"—";
 return`<div class="row"><button data-v="home">Home</button></div><div class="card"><h2>My words</h2><p><b>Mastered</b><br>${g(v=>v.b>=3)}</p><p><b>Learning</b><br>${g(v=>v.b>0&&v.b<3)}</p><p><b>Struggling</b><br>${g(v=>v.b==0&&v.m>0)}</p></div>`}
/* ===== 7. EVENTS & MODULE INTERACTIONS ===== */
function wire(){let A=$("#app"),it=R&&R.q&&R.q[R.i],pick=[];
 A.onclick=e=>{let t=e.target.closest("button,#fc");if(!t)return;let D=t.dataset;
  if(D.go){let[l,m]=D.go.split("|");start(l,m)}
  else if(D.test)startTest();
  else if(D.tab){S.tab=D.tab;save();draw()}
  else if(D.gr){S.gr=+D.gr;save();draw()}
  else if(D.gs)startGS(S.gr||6,+D.gs);
  else if(D.gt){S.gt=D.gt;save();draw()}
  else if(D.gx)gsx(S.gr||6,D.gx);
  else if(D.gfl){S.fwg=S.gr||6;R=null;view="flash";draw()}
  else if(D.gsk)startSkill(LV[GL[S.gr||6]],D.gsk);
  else if(D.sk)startSkill($("#sl").value,D.sk);
  else if(D.p){let[a,b]=D.p.split(":");a=="m"?start(curLv(),b):startSkill(curLv(),b)}
  else if(D.daily)startDaily($("#dl").value);
  else if(D.endless)startEndless(D.el||$("#el").value,D.em||$("#em").value);
  else if(D.apply){S.est=R.res.o;save();R=null;view="home";draw()}
  else if(D.v){if(R)clearTimeout(R.tm);if(D.v=="flash")S.fwg=0;view=D.v;if(D.v!="flash")R=D.v=="home"?null:R;draw()}
  else if(D.say!=null){let s=rate;if(D.slow)rate=.55;say(D.say);rate=s}
  else if(t.id=="rs"){if(confirm("Reset all progress?")){S={p:{},v:{},pl:0,bs:0};save();draw()}}
  else if(t.id=="fc"){R.fl^=1;draw()}
  else if(D.k!=null){let ws=fw();vmark(ws[R.i%ws.length][0],D.k=="1");save();R.i++;R.fl=0;draw()}
  else if(t.id=="nx"){R.i++;R.done=0;(R.endless?R.lives>0:R.i<R.q.length)?draw():finish()}
  else if(D.o!=null){let k=+D.o==it.a;if(!R.done){t.classList.add(k?"ok":"no");if(!k)A.querySelectorAll("[data-o]")[it.a].classList.add("ok")}answer(k,it,"")}
  else if(D.w!=null){pick.push(it.w[D.w]);t.disabled=true;$("#sel").textContent=pick.join(" ")}
  else if(t.id=="un"){pick=[];draw2()}
  else if(t.id=="ck"&&it.t=="write")wcheck(it);
  else if(t.id=="ck"){let v=it.t=="type"?$("#tx").value:pick.join(" ");answer(it.a.split("/").some(a=>norm(v).join(" ")==norm(a).join(" ")),it,it.t=="type"?"":"")}
  else if(t.id=="rec")listen(it);
  else if(t.id=="snd")tsend();
  else if(D.self!=null)answer(D.self=="1",{...it,x:"Compare with the audio and keep practising."});};
 const draw2=()=>{pick=[];document.querySelectorAll("[data-w]").forEach(b=>b.disabled=false);$("#sel").textContent=""};
 let c=$("#pl");if(c)c.onchange=()=>{S.pl=c.checked?1:0;save();draw()};
 let r=$("#rt");if(r)r.oninput=()=>rate=+r.value;
 let ti=$("#ti");if(ti){ti.focus();ti.onkeydown=e=>{if(e.key=="Enter")tsend()}}
 let wr=$("#wr");if(wr){wr.focus();wr.oninput=()=>$("#cl").innerHTML=cl(wr.value,it)}
 let tx=$("#tx");if(tx){tx.focus();tx.onkeydown=e=>{if(e.key=="Enter")$("#ck").click()}}
 let fc=$("#fc");if(fc)fc.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();fc.click()}};
 if(it&&it.say&&it.t!="speak")setTimeout(()=>say(it.say),300);
 if(R&&(R.endless||R.timed)&&view=="round"&&it&&!R.done&&it.t!="speak"&&it.t!="write")etimer(it)}
/* Writing checklist (B2+): word count, linking words, sentences */
const LINK=/\b(however|therefore|although|moreover|in addition|because|for example|on the other hand|on the one hand|while|firstly|finally|as a result|nevertheless|whereas|yet)\b/gi;
function chk(v,it){let n=norm(v).length,l=(v.match(LINK)||[]).length,c=(v.match(/[.!?]/g)||[]).length;return[[n>=it.min,"At least "+it.min+" words ("+n+")"],[l>=2,"2+ linking words ("+l+")"],[c>=3,"3+ sentences ("+c+")"]]}
const cl=(v,it)=>chk(v,it).map(c=>(c[0]?"✓ ":"○ ")+c[1]).join("<br>");
function wcheck(it){let v=$("#wr").value;answer(chk(v,it).every(c=>c[0]),it,"<br>"+cl(v,it)+"<br><b>Model answer:</b> "+esc(it.a));$("#wr").readOnly=true}
/* Speaking / Pronunciation: record, compare words, highlight misses */
function listen(it){let rc=new SR();rc.lang="en-US";$("#rec").textContent="Listening…";
 rc.onresult=e=>{let heard=norm(e.results[0][0].transcript),tg=norm(it.a),hit=tg.map(w=>heard.includes(w)),p=Math.round(100*hit.filter(Boolean).length/tg.length);
  answer(p>=spt(it),{...it,x:""},`Match ${p}%. `+tg.map((w,i)=>hit[i]?w:`<span class="miss">${w}</span>`).join(" ")+(p<spt(it)?"<br>Need "+spt(it)+"% at this level. Hear it again and retry.":""))};
 rc.onerror=()=>{$("#rec").textContent="● Record";$("#fb").textContent="Could not hear you. Check the microphone permission and try again."};
 rc.start()}
draw();loadFeed().then(()=>{if(view=="home")draw()});
/* Auto-update: re-check the feed whenever the tab becomes visible again (e.g. next morning) */
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible")loadFeed().then(()=>{if(view=="home")draw()})});
</script></body></html>
